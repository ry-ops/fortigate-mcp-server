<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-labelledby="t d">
  <title id="t">From an empty Proxmox host to a working firewall</title>
  <desc id="d">Five steps: deploy_fortigate_vm (proxmox-mcp-server) creates the VM; activate_vm_eval_license turns on the free license; forticonverter_setup_prompt hides the setup popup; DHCP, DNS and policies set up the lab network; k8s_sync_ingress_dns gives cluster apps names.</desc>
  <defs>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#161b22"/></pattern>
    <style>
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="208" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="208" rx="16" fill="url(#g)"/>
  <text x="32" y="38" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Zero to firewall, in tool calls</text>
  <text x="868" y="38" text-anchor="end" class="mono" font-size="11" fill="#8b949e">proxmox-mcp-server <tspan fill="#30363d">+</tspan> fortigate-mcp-server</text>

  <!-- rail and the progress that sweeps across it (12 s loop) -->
  <line x1="102" y1="82" x2="798" y2="82" stroke="#21262d" stroke-width="4" stroke-linecap="round"/>
  <line x1="102" y1="82" x2="102" y2="82" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="102;798;798;102" keyTimes="0;.75;.95;1" dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- step nodes: each lights up when the sweep reaches it (x/696 of .75 of the loop) -->
  <g class="mono" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="102" cy="82" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#2dd4bf;#2dd4bf;#30363d" keyTimes="0;.01;.95;1" dur="12s" repeatCount="indefinite"/></circle>
    <text x="102" y="87" fill="#e6edf3">1</text>
    <circle cx="276" cy="82" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#30363d;#2dd4bf;#2dd4bf;#30363d" keyTimes="0;.1875;.1975;.95;1" dur="12s" repeatCount="indefinite"/></circle>
    <text x="276" y="87" fill="#e6edf3">2</text>
    <circle cx="450" cy="82" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#30363d;#2dd4bf;#2dd4bf;#30363d" keyTimes="0;.375;.385;.95;1" dur="12s" repeatCount="indefinite"/></circle>
    <text x="450" y="87" fill="#e6edf3">3</text>
    <circle cx="624" cy="82" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#30363d;#2dd4bf;#2dd4bf;#30363d" keyTimes="0;.5625;.5725;.95;1" dur="12s" repeatCount="indefinite"/></circle>
    <text x="624" y="87" fill="#e6edf3">4</text>
    <circle cx="798" cy="82" r="15" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#30363d;#3fb950;#3fb950;#30363d" keyTimes="0;.75;.76;.95;1" dur="12s" repeatCount="indefinite"/></circle>
    <text x="798" y="87" fill="#e6edf3">5</text>
  </g>

  <!-- labels: tool name, then what it does -->
  <g text-anchor="middle">
    <text x="102" y="124" class="mono" font-size="10" fill="#2dd4bf">deploy_fortigate_vm</text>
    <text x="102" y="144" class="sans" font-size="12" fill="#e6edf3">image to VM, NICs</text>
    <text x="102" y="160" class="sans" font-size="12" fill="#e6edf3">on your VLANs</text>
    <text x="102" y="182" class="mono" font-size="10" fill="#8b949e">proxmox-mcp-server</text>

    <text x="276" y="124" class="mono" font-size="10" fill="#2dd4bf">activate_vm_eval_license</text>
    <text x="276" y="144" class="sans" font-size="12" fill="#e6edf3">free permanent trial</text>
    <text x="276" y="160" class="sans" font-size="12" fill="#e6edf3">via FortiCloud</text>
    <text x="276" y="182" class="mono" font-size="10" fill="#8b949e">after the console password</text>

    <text x="450" y="124" class="mono" font-size="10" fill="#2dd4bf">forticonverter_setup_prompt</text>
    <text x="450" y="144" class="sans" font-size="12" fill="#e6edf3">hide the setup popup</text>
    <text x="450" y="160" class="sans" font-size="12" fill="#e6edf3">that never completes</text>

    <text x="624" y="124" class="mono" font-size="10" fill="#2dd4bf">DHCP · DNS · policies</text>
    <text x="624" y="144" class="sans" font-size="12" fill="#e6edf3">reservations, a local zone,</text>
    <text x="624" y="160" class="sans" font-size="12" fill="#e6edf3">egress + ingress rules</text>

    <text x="798" y="124" class="mono" font-size="10" fill="#2dd4bf">k8s_sync_ingress_dns</text>
    <text x="798" y="144" class="sans" font-size="12" fill="#e6edf3">cluster apps get</text>
    <text x="798" y="160" class="sans" font-size="12" fill="#e6edf3">names like whoami.lab</text>
  </g>
  <rect x="1" y="1" width="898" height="208" rx="16" fill="none" stroke="#30363d"/>
</svg>

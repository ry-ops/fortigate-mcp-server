<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">ry-ops /fortigate-mcp-server</title>
  <desc id="d">Manage a FortiGate firewall from Claude with 74 MCP tools; it works within the free FortiGate-VM license. Packets reach a firewall appliance; allowed ones pass through, denied ones are dropped.</desc>
  <defs>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#161b22"/></pattern>
    <radialGradient id="h" cx="22%" cy="50%" r="38%"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="u" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".6" stop-color="#58a6ff" stop-opacity=".35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
    <path id="in1" d="M18 92H112"/>
    <path id="in2" d="M18 130H112"/>
    <path id="in3" d="M18 168H112"/>
    <path id="out" d="M268 130H330"/>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>
    <style>
      .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .led{animation:led 1.6s steps(1) infinite}.l2{animation-delay:-.5s}.l3{animation-delay:-1.1s}.l4{animation-delay:-.2s}
      @keyframes led{0%,60%{opacity:1}61%,100%{opacity:.25}}
      .scan{animation:scan 3s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(64px)}}
      .wire{fill:none;stroke:#21262d;stroke-width:4;stroke-linecap:round}
      .flow{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-dasharray:4 10;animation:dash 1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-14}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      .chip{fill:#161b22;stroke:#30363d}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="898" height="258" rx="16" fill="#0d1117"/>
    <rect x="1" y="1" width="898" height="258" fill="url(#g)"/>
    <rect x="1" y="1" width="898" height="258" fill="url(#h)"/>

    <!-- inbound wires and packets -->
    <use href="#in1" class="wire"/><use href="#in2" class="wire"/><use href="#in3" class="wire"/>
    <circle r="5" fill="#2dd4bf"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#in1"/></animateMotion></circle>
    <circle r="5" fill="#58a6ff"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite"><mpath href="#in2"/></animateMotion></circle>
    <circle r="5" fill="#f85149"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#in3"/></animateMotion></circle>
    <!-- denied packet: an X flashes where port3's traffic is dropped -->
    <g transform="translate(104 168)" stroke="#f85149" stroke-width="3" stroke-linecap="round" opacity="0">
      <path d="M-6-6L6 6M6-6L-6 6"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.9;.95;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- the appliance -->
    <rect x="112" y="62" width="156" height="136" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="112" y="62" width="156" height="28" rx="12" fill="#21262d"/>
    <rect x="112" y="78" width="156" height="12" fill="#21262d"/>
    <text x="190" y="81" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">fgt-lab · FortiOS 7.6</text>
    <g class="mono" font-size="10" fill="#8b949e">
      <text x="128" y="114">port1</text><text x="128" y="138">port2</text><text x="128" y="162">port3</text><text x="128" y="186">mgmt</text>
    </g>
    <circle cx="246" cy="110" r="5" fill="#3fb950" class="led"/>
    <circle cx="246" cy="134" r="5" fill="#3fb950" class="led l2"/>
    <circle cx="246" cy="158" r="5" fill="#d29922" class="led l3"/>
    <circle cx="246" cy="182" r="5" fill="#58a6ff" class="led l4"/>
    <rect x="172" y="100" width="56" height="2" rx="1" fill="#2dd4bf" opacity=".7" class="scan"/>

    <!-- allowed traffic leaves the appliance -->
    <use href="#out" class="wire"/>
    <use href="#out" class="flow"/>
    <circle r="5" fill="#2dd4bf"><animateMotion dur="1.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></circle>

    <!-- title block -->
    <text x="360" y="92" class="mono" font-size="17" fill="#8b949e">ry-ops <tspan fill="#30363d">/</tspan></text>
    <text x="358" y="132" class="sans" font-size="40" font-weight="700" fill="url(#title)">fortigate-mcp-server</text>
    <rect x="360" y="146" width="420" height="3" rx="1.5" fill="url(#u)"/>
    <text x="360" y="176" class="sans" font-size="16" fill="#e6edf3">Manage a FortiGate firewall from Claude with <tspan fill="#2dd4bf" font-weight="600">74 MCP tools</tspan><tspan class="blink" fill="#2dd4bf">▍</tspan></text>

    <!-- chips: width = text (6.7px/char at 11px mono) + padding -->
    <g class="mono" font-size="11">
      <rect x="360" y="196" width="62" height="24" rx="12" class="chip"/>
      <text x="391" y="212" text-anchor="middle" fill="#2dd4bf">v0.4.0</text>
      <rect x="430" y="196" width="130" height="24" rx="12" class="chip"/>
      <circle cx="443" cy="208" r="4" fill="#3fb950" class="pulse"/>
      <text x="454" y="212" fill="#e6edf3">read-only mode</text>
      <rect x="568" y="196" width="82" height="24" rx="12" class="chip"/>
      <text x="609" y="212" text-anchor="middle" fill="#e6edf3">k3s-aware</text>
      <rect x="658" y="196" width="109" height="24" rx="12" class="chip"/>
      <text x="712.5" y="212" text-anchor="middle" fill="#e6edf3">Proxmox-aware</text>
      <rect x="775" y="196" width="102" height="24" rx="12" class="chip"/>
      <text x="826" y="212" text-anchor="middle" fill="#e6edf3">free license</text>
    </g>
    <rect x="1" y="1" width="898" height="258" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>

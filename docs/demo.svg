<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xml:space="preserve">
  <title id="t">fortigate-mcp-server in a Claude Code session</title>
  <desc id="d">Three looping scenes: finding the top bandwidth users with their Proxmox VM names, syncing a Kubernetes Ingress hostname into FortiGate DNS, and a port forward refused up front because FortiOS cannot mix VIPs with addresses while the free license has no policy slot left.</desc>
  <defs>
    <clipPath id="c00"><rect x="40" y="58" height="24" width="0"><animate attributeName="width" values="0;0;389;389" keyTimes="0.0000;0.0133;0.0623;1.0000" dur="30s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c10"><rect x="40" y="58" height="24" width="0"><animate attributeName="width" values="0;0;424;424" keyTimes="0.0000;0.3467;0.4000;1.0000" dur="30s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c20"><rect x="40" y="58" height="24" width="0"><animate attributeName="width" values="0;0;520;520" keyTimes="0.0000;0.6800;0.7333;1.0000" dur="30s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .m{white-space:pre;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}
      .s{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:15px}
      .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v23H1z" fill="#161b22"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#f85149"/><circle cx="44" cy="20" r="6" fill="#d29922"/><circle cx="64" cy="20" r="6" fill="#3fb950"/>
  <text x="450" y="25" text-anchor="middle" class="m" fill="#8b949e" font-size="12">claude  ·  mcp: fortigate (74 tools, read-only)</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0067;0.3200;0.3300;1.0000" dur="30s" repeatCount="indefinite"/>
    <g clip-path="url(#c00)"><text x="40" y="74" class="m" fill="#2dd4bf">&gt;</text><text x="58" y="74" class="m" fill="#e6edf3">Who is using the most bandwidth right now?</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0800;0.0883;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="103" r="4.5" fill="#2dd4bf"/><text x="58" y="107" class="m"><tspan fill="#8b949e">fortigate · </tspan><tspan fill="#e6edf3" font-weight="600">get_top_traffic(report_by="destination", resolve_vms=true)</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1133;0.1217;1.0000" dur="30s" repeatCount="indefinite"/><text x="66" y="130" class="m" fill="#484f58">⎿</text><text x="86" y="130" class="m" fill="#c9d1d9">speed.cloudflare.com:443   13.8 MB   HTTPS.BROWSER</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1267;0.1350;1.0000" dur="30s" repeatCount="indefinite"/><text x="86" y="153" class="m" fill="#8b949e">from 192.168.150.12 = 112 k3s-worker2 (qemu on pve01)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1800;0.1883;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="182" r="4.5" fill="#e6edf3"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1800;0.1883;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="186" class="s" fill="#e6edf3">One heavy flow: VM 112 (k3s-worker2) is downloading from</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1900;0.1983;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="209" class="s" fill="#e6edf3">speed.cloudflare.com, so a speed test. Nothing else is busy.</text></g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3400;0.6533;0.6633;1.0000" dur="30s" repeatCount="indefinite"/>
    <g clip-path="url(#c10)"><text x="40" y="74" class="m" fill="#2dd4bf">&gt;</text><text x="58" y="74" class="m" fill="#e6edf3">Give the whoami app a name on the lab network.</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4133;0.4217;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="103" r="4.5" fill="#2dd4bf"/><text x="58" y="107" class="m"><tspan fill="#8b949e">fortigate · </tspan><tspan fill="#e6edf3" font-weight="600">k8s_sync_ingress_dns(zone="lab", dry_run=false)</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4467;0.4550;1.0000" dur="30s" repeatCount="indefinite"/><text x="66" y="130" class="m" fill="#484f58">⎿</text><text x="86" y="130" class="m" fill="#3fb950">+ whoami.lab -&gt; 192.168.150.10</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4567;0.4650;1.0000" dur="30s" repeatCount="indefinite"/><text x="86" y="153" class="m" fill="#3fb950">+ whoami.lab -&gt; 192.168.150.11</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4667;0.4750;1.0000" dur="30s" repeatCount="indefinite"/><text x="86" y="176" class="m" fill="#3fb950">+ whoami.lab -&gt; 192.168.150.12</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4800;0.4883;1.0000" dur="30s" repeatCount="indefinite"/><text x="86" y="199" class="m" fill="#8b949e">skipped: none   ·   running it again changes nothing</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5200;0.5283;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="228" r="4.5" fill="#e6edf3"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5200;0.5283;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="232" class="s" fill="#e6edf3">whoami.lab now resolves behind the FortiGate, one A record per</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5300;0.5383;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="255" class="s" fill="#e6edf3">Traefik IP, since FortiOS can't hold a *.lab wildcard.</text></g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6733;0.9867;0.9967;1.0000" dur="30s" repeatCount="indefinite"/>
    <g clip-path="url(#c20)"><text x="40" y="74" class="m" fill="#2dd4bf">&gt;</text><text x="58" y="74" class="m" fill="#e6edf3">Publish Traefik on the firewall's WAN address, port 8443.</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7467;0.7550;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="103" r="4.5" fill="#2dd4bf"/><text x="58" y="107" class="m"><tspan fill="#8b949e">fortigate · </tspan><tspan fill="#e6edf3" font-weight="600">create_port_forward(extport=8443, mappedport=443, attach_to_policy=3)</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7800;0.7883;1.0000" dur="30s" repeatCount="indefinite"/><text x="66" y="130" class="m" fill="#484f58">⎿</text><text x="86" y="130" class="m" fill="#f85149">✗ Policy 3 has ordinary destinations ['K3S-NODES'], and FortiOS cannot</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7867;0.7950;1.0000" dur="30s" repeatCount="indefinite"/><text x="86" y="153" class="m" fill="#f85149">  mix them with VIPs. (Nothing was created.)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8200;0.8283;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="178" r="4.5" fill="#2dd4bf"/><text x="58" y="182" class="m"><tspan fill="#8b949e">fortigate · </tspan><tspan fill="#e6edf3" font-weight="600">get_license_limits()</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8467;0.8550;1.0000" dur="30s" repeatCount="indefinite"/><text x="66" y="205" class="m" fill="#484f58">⎿</text><text x="86" y="205" class="m" fill="#c9d1d9">policies 3/3 used, 0 free   ·   interfaces 2/3   ·   routes 0/3</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8800;0.8883;1.0000" dur="30s" repeatCount="indefinite"/><circle cx="46" cy="234" r="4.5" fill="#e6edf3"/></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8800;0.8883;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="238" class="s" fill="#e6edf3">No policy slot is free on the trial license. I can turn policy 3</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8900;0.8983;1.0000" dur="30s" repeatCount="indefinite"/><text x="58" y="261" class="s" fill="#e6edf3">into a VIP-only policy (replace_destinations=true). Go ahead?</text></g>
  </g>
  <circle cx="434" cy="318" r="4" fill="#30363d"/>
  <circle cx="434" cy="318" r="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0067;0.3200;0.3300;1.0000" dur="30s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="318" r="4" fill="#30363d"/>
  <circle cx="450" cy="318" r="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3400;0.6533;0.6633;1.0000" dur="30s" repeatCount="indefinite"/></circle>
  <circle cx="466" cy="318" r="4" fill="#30363d"/>
  <circle cx="466" cy="318" r="4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6733;0.9867;0.9967;1.0000" dur="30s" repeatCount="indefinite"/></circle>
  <text x="876" y="322" text-anchor="end" class="m" fill="#484f58" font-size="11">replays a real lab session</text>
</svg>

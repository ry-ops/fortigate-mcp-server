[project]
name = "fortigate-mcp-server"
version = "0.3.0"
description = "MCP server for managing Fortinet FortiGate firewalls (FortiOS REST API) with AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ry-ops", email = ""},
]
keywords = ["mcp", "fortigate", "fortios", "fortinet", "firewall", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    # mcp 2.x removed the @app.list_tools()/@app.call_tool() decorator API used in server.py.
    "mcp>=1.0.0,<2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/ry-ops/fortigate-mcp-server"
Repository = "https://github.com/ry-ops/fortigate-mcp-server"
Issues = "https://github.com/ry-ops/fortigate-mcp-server/issues"

[project.scripts]
fortigate-mcp-server = "fortigate_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortigate_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

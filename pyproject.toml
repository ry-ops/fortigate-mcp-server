[project]
name = "fortigate-mcp-server"
version = "1.1.3"
description = "MCP server for managing Fortinet FortiGate firewalls (FortiOS REST API) with AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ry-ops"},
]
keywords = ["mcp", "fortigate", "fortios", "fortinet", "firewall", "model-context-protocol", "claude", "security-audit", "kubernetes", "proxmox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    # 2.x registers handlers in the Server constructor; the 1.x decorators are gone.
    "mcp>=2.3.0,<3",
    "jsonschema>=4.20.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ry-ops/fortigate-mcp-server"
Repository = "https://github.com/ry-ops/fortigate-mcp-server"
Issues = "https://github.com/ry-ops/fortigate-mcp-server/issues"

[project.scripts]
fortigate-mcp-server = "fortigate_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortigate_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
